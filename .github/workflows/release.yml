name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine plugin name
        id: plugin
        run: |
          FILE=$(find . -maxdepth 1 -name '*.pplugin' -printf '%f\n')
          echo "name=${FILE%.pplugin}" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        run: |
          mkdir -p "dist/${{ steps.plugin.outputs.name }}"
          cp "${{ steps.plugin.outputs.name }}.mjs" "${{ steps.plugin.outputs.name }}.pplugin" "dist/${{ steps.plugin.outputs.name }}/"
          (cd dist && zip -r "${{ steps.plugin.outputs.name }}-${{ needs.release-please.outputs.tag_name }}.zip" "${{ steps.plugin.outputs.name }}")

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "dist/${{ steps.plugin.outputs.name }}-${{ needs.release-please.outputs.tag_name }}.zip"
